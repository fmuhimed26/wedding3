<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>استقبال الضيوف</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --wine: #651f2b;
      --wine-dark: #42131d;
      --wine-light: #8b3545;
      --gold: #c9a45c;
      --gold-light: #e7d19d;
      --cream: #f8f3e8;
      --white: #ffffff;
      --text: #30252a;
      --muted: #8a7d80;
      --green: #438263;
      --red: #b84f4f;
      --border: #e7ddd5;
    }

    body {
      font-family: "Cairo", sans-serif;
      min-height: 100vh;
      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(201,164,92,.16),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(101,31,43,.12),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #faf7ef,
          #eee5d8
        );
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.97);
      border-radius: 27px;
      padding: 40px 30px;
      text-align: center;
      border: 1px solid rgba(201,164,92,.30);

      box-shadow:
        0 30px 80px
        rgba(65,20,30,.16);
    }

    .login-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          var(--wine-dark),
          var(--wine)
        );

      color: var(--gold-light);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
    }

    .login-card h1 {
      color: var(--wine-dark);
      font-size: 25px;
      margin-bottom: 7px;
    }

    .login-card p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .field {
      text-align: right;
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      color: var(--wine-dark);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      height: 50px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      outline: none;
      background: white;
      font-family: inherit;
    }

    .field input:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px
        rgba(201,164,92,.12);
    }

    .primary-btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--wine-dark),
          var(--wine)
        );

      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .error-box {
      background: #fff0f0;
      color: var(--red);
      border: 1px solid #f0cccc;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      margin-top: 15px;
      display: none;
    }

    /* =========================
       APP
    ========================= */

    #app {
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .topbar {
      background:
        linear-gradient(
          135deg,
          var(--wine-dark),
          var(--wine)
        );

      color: white;
      padding: 15px 20px;

      box-shadow:
        0 5px 25px
        rgba(65,20,30,.20);
    }

    .topbar-inner {
      max-width: 800px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          var(--gold-light)
        );

      color: var(--wine-dark);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
    }

    .brand h1 {
      font-size: 17px;
    }

    .brand span {
      color: var(--gold-light);
      font-size: 11px;
    }

    .logout-btn {
      border: 1px solid rgba(255,255,255,.25);
      background: transparent;
      color: white;

      padding: 9px 15px;
      border-radius: 10px;

      cursor: pointer;
      font-size: 12px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 25px 15px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 20px;
    }

    .welcome h2 {
      color: var(--wine-dark);
      font-size: 25px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 18px;

      box-shadow:
        0 15px 40px
        rgba(65,20,30,.08);
    }

    .card-title {
      color: var(--wine-dark);
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    /* =========================
       SCANNER
    ========================= */

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 15px;
      overflow: hidden;
      border-radius: 17px;
    }

    #reader video {
      border-radius: 17px !important;
    }

    .scanner-status {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
    }

    .manual {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .manual input {
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 0 14px;
      outline: none;

      direction: ltr;
      text-align: center;

      font-family: monospace;
    }

    .manual button {
      height: 48px;
      border: none;
      border-radius: 11px;
      padding: 0 20px;

      background: var(--wine);
      color: white;

      cursor: pointer;
      font-weight: 700;
    }

    /* =========================
       RESULT
    ========================= */

    #result {
      display: none;
    }

    .guest-result {
      text-align: center;
    }

    .guest-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 50%;

      background: #edf8f1;
      color: var(--green);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
    }

    .guest-name {
      color: var(--wine-dark);
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .guest-seats {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .success-box {
      background: #edf8f1;
      color: var(--green);
      border: 1px solid #cde8d7;
      border-radius: 12px;
      padding: 13px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .already-box {
      background: #fff7e5;
      color: #8a681e;
      border: 1px solid #ead9a8;
      border-radius: 12px;
      padding: 13px;
      font-size: 13px;
    }

    .danger-box {
      background: #fff0f0;
      color: var(--red);
      border: 1px solid #f0cccc;
      border-radius: 12px;
      padding: 13px;
      font-size: 13px;
    }

    .result-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .back-btn {
      height: 46px;
      border: none;
      border-radius: 11px;

      background: #eee9dd;
      color: var(--wine-dark);

      cursor: pointer;
      font-weight: 700;
    }

    .scan-again-btn {
      height: 46px;
      border: none;
      border-radius: 11px;

      background: var(--wine);
      color: white;

      cursor: pointer;
      font-weight: 700;
    }

    @media (max-width: 600px) {

      .manual {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 12px 15px;
      }

      .brand h1 {
        font-size: 14px;
      }

      .container {
        padding: 18px 10px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <section id="loginPage">

    <div class="login-card">

      <div class="login-icon">
        🎟️
      </div>

      <h1>
        تسجيل دخول الاستقبال
      </h1>

      <p>
        Reception Login
      </p>

      <form id="loginForm">

        <div class="field">

          <label>
            البريد الإلكتروني
          </label>

          <input
            id="email"
            type="email"
            placeholder="البريد الإلكتروني للاستقبال"
            autocomplete="username"
            required
          />

        </div>

        <div class="field">

          <label>
            كلمة المرور
          </label>

          <input
            id="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />

        </div>

        <button
          class="primary-btn"
          type="submit"
          id="loginBtn"
        >
          دخول
        </button>

      </form>

      <div
        id="loginMessage"
        class="error-box"
      ></div>

    </div>

  </section>


  <!-- APP -->

  <section
    id="app"
    class="hidden"
  >

    <header class="topbar">

      <div class="topbar-inner">

        <div class="brand">

          <div class="brand-icon">
            💍
          </div>

          <div>

            <h1>
              استقبال زفاف أحمد وليان
            </h1>

            <span>
              Reception Check-in
            </span>

          </div>

        </div>

        <button
          class="logout-btn"
          id="logoutBtn"
        >
          تسجيل الخروج
        </button>

      </div>

    </header>


    <main class="container">

      <div class="welcome">

        <h2>
          تسجيل دخول الضيوف
        </h2>

        <p id="loggedUser"></p>

      </div>


      <!-- SCANNER -->

      <div
        class="card"
        id="scannerCard"
      >

        <div class="card-title">
          📷 مسح QR Code
        </div>

        <div id="reader"></div>

        <div
          id="scannerStatus"
          class="scanner-status"
        >
          وجّه الكاميرا نحو QR الدعوة
        </div>

      </div>


      <!-- MANUAL -->

      <div
        class="card"
        id="manualCard"
      >

        <div class="card-title">
          🎫 إدخال رقم الدعوة يدويًا
        </div>

        <div class="manual">

          <input
            id="manualQR"
            type="text"
            placeholder="INV-001"
            autocomplete="off"
          />

          <button
            id="manualBtn"
            type="button"
          >
            تحقق
          </button>

        </div>

      </div>


      <!-- RESULT -->

      <div
        class="card"
        id="result"
      >

        <div class="guest-result">

          <div class="guest-icon">
            ✓
          </div>

          <div
            id="guestName"
            class="guest-name"
          ></div>

          <div
            id="guestSeats"
            class="guest-seats"
          ></div>

          <div id="resultMessage"></div>


          <div class="result-buttons">

            <button
              class="back-btn"
              id="backBtn"
              type="button"
            >
              رجوع
            </button>

            <button
              class="scan-again-btn"
              id="scanAgainBtn"
              type="button"
            >
              مسح دعوة أخرى
            </button>

          </div>

        </div>

      </div>

    </main>

  </section>


  <script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://grkdftimaohbmfnaylmr.supabase.co";

    /*
      مهم:
      استبدل النص التالي بنفس Publishable Key
      الموجود عندك حاليًا.
    */

    const SUPABASE_KEY =
      "sb_publishable_-qUqrfA1-cITErq8_1T8OA_2Fsaq4H1";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       RECEPTION ACCESS
    ===================================================== */

    const RECEPTION_EMAIL =
      "institutevet@gmail.com";


    function isReceptionUser(user) {

      return (
        !!user &&
        typeof user.email === "string" &&
        user.email.trim().toLowerCase() ===
          RECEPTION_EMAIL.toLowerCase()
      );
    }


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loginPage =
      document.getElementById("loginPage");

    const app =
      document.getElementById("app");

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const loginMessage =
      document.getElementById("loginMessage");

    const loggedUser =
      document.getElementById("loggedUser");

    const manualQR =
      document.getElementById("manualQR");

    const manualBtn =
      document.getElementById("manualBtn");

    const result =
      document.getElementById("result");

    const guestName =
      document.getElementById("guestName");

    const guestSeats =
      document.getElementById("guestSeats");

    const resultMessage =
      document.getElementById("resultMessage");

    const scannerCard =
      document.getElementById("scannerCard");

    const manualCard =
      document.getElementById("manualCard");

    const scannerStatus =
      document.getElementById("scannerStatus");


    /* =====================================================
       SCANNER
    ===================================================== */

    let scanner = null;
    let scannerRunning = false;
    let processingCode = false;


    /* =====================================================
       LOGIN MESSAGE
    ===================================================== */

    function showLoginMessage(text) {

      loginMessage.textContent = text;

      loginMessage.style.display =
        "block";

      loginMessage.style.background =
        "#fff0f0";

      loginMessage.style.color =
        "#b84f4f";
    }


    function clearLoginMessage() {

      loginMessage.textContent = "";

      loginMessage.style.display =
        "none";
    }


    /* =====================================================
       SHOW LOGIN
    ===================================================== */

    function showLogin() {

      stopScanner();

      app.classList.add("hidden");

      loginPage.classList.remove("hidden");

      loggedUser.textContent = "";

      passwordInput.value = "";
    }


    /* =====================================================
       SHOW APP
    ===================================================== */

    async function showApp(user) {

      /*
        حماية إضافية.
        لا يسمح لأي حساب غير الاستقبال.
      */

      if (!isReceptionUser(user)) {

        await supabaseClient.auth.signOut();

        showLogin();

        showLoginMessage(
          "هذا الحساب غير مخصص لصفحة الاستقبال."
        );

        return;
      }


      loginPage.classList.add("hidden");

      app.classList.remove("hidden");


      loggedUser.textContent =
        "مسجل الدخول: " +
        user.email;


      await startScanner();
    }


    /* =====================================================
       HANDLE SESSION
    ===================================================== */

    async function handleSession(session) {

      if (
        !session ||
        !session.user
      ) {

        showLogin();

        return;
      }


      /*
        أي Session ليست لحساب الاستقبال
        يتم تسجيل خروجها مباشرة.
      */

      if (
        !isReceptionUser(
          session.user
        )
      ) {

        await supabaseClient.auth.signOut();

        showLogin();

        showLoginMessage(
          "هذا الحساب غير مخصص لصفحة الاستقبال. استخدم حساب الاستقبال."
        );

        return;
      }


      await showApp(
        session.user
      );
    }


    /* =====================================================
       LOGIN
    ===================================================== */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        clearLoginMessage();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (
          !email ||
          !password
        ) {

          showLoginMessage(
            "أدخل البريد الإلكتروني وكلمة المرور."
          );

          return;
        }


        /*
          منع أي إيميل آخر مباشرة.
        */

        if (
          email.toLowerCase() !==
          RECEPTION_EMAIL.toLowerCase()
        ) {

          showLoginMessage(
            "هذا البريد غير مسموح له بالدخول إلى صفحة الاستقبال."
          );

          return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
          "جاري الدخول...";


        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });


        if (error) {

          console.error(error);

          showLoginMessage(
            "البريد الإلكتروني أو كلمة المرور غير صحيحة."
          );

          loginBtn.disabled = false;

          loginBtn.textContent =
            "دخول";

          return;
        }


        /*
          تحقق نهائي من المستخدم الذي أعاده Supabase.
        */

        if (
          !isReceptionUser(
            data.user
          )
        ) {

          await supabaseClient.auth.signOut();

          showLoginMessage(
            "هذا الحساب غير مخصص لصفحة الاستقبال."
          );

          loginBtn.disabled = false;

          loginBtn.textContent =
            "دخول";

          return;
        }


        loginBtn.disabled = false;

        loginBtn.textContent =
          "دخول";


        await showApp(
          data.user
        );
      }
    );


    /* =====================================================
       AUTH STATE
    ===================================================== */

    supabaseClient.auth.onAuthStateChange(
      async function(event, session) {

        if (!session) {

          showLogin();

          return;
        }


        if (
          !isReceptionUser(
            session.user
          )
        ) {

          await supabaseClient.auth.signOut();

          showLogin();

          showLoginMessage(
            "هذا الحساب غير مخصص لصفحة الاستقبال."
          );

          return;
        }


        await showApp(
          session.user
        );
      }
    );


    /* =====================================================
       LOGOUT
    ===================================================== */

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async function() {

          await stopScanner();

          await supabaseClient.auth.signOut();

          showLogin();
        }
      );


    /* =====================================================
       START SCANNER
    ===================================================== */

    async function startScanner() {

      if (scannerRunning) {
        return;
      }


      if (!scanner) {

        scanner =
          new Html5Qrcode("reader");
      }


      try {

        const cameras =
          await Html5Qrcode.getCameras();


        if (
          !cameras ||
          !cameras.length
        ) {

          scannerStatus.textContent =
            "لم يتم العثور على كاميرا. استخدم الإدخال اليدوي.";

          return;
        }


        const cameraId =
          cameras[0].id;


        await scanner.start(
          cameraId,
          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }
          },

          async function(decodedText) {

            if (processingCode) {
              return;
            }


            processingCode = true;


            await handleQRCode(
              decodedText
            );


            setTimeout(
              function() {

                processingCode =
                  false;

              },
              1000
            );
          },

          function() {}
        );


        scannerRunning = true;


        scannerStatus.textContent =
          "الكاميرا جاهزة — وجّهها نحو QR الدعوة.";

      }
      catch (error) {

        console.error(error);

        scannerStatus.textContent =
          "تعذر تشغيل الكاميرا. تأكد من إعطاء صلاحية الكاميرا أو استخدم الإدخال اليدوي.";
      }
    }


    /* =====================================================
       STOP SCANNER
    ===================================================== */

    async function stopScanner() {

      if (
        scanner &&
        scannerRunning
      ) {

        try {

          await scanner.stop();

        }
        catch (error) {

          console.error(error);
        }

        scannerRunning = false;
      }
    }


    /* =====================================================
       MANUAL QR
    ===================================================== */

    manualBtn.addEventListener(
      "click",
      async function() {

        const code =
          manualQR.value.trim();


        if (!code) {

          alert(
            "أدخل رقم الدعوة."
          );

          return;
        }


        await handleQRCode(code);
      }
    );


    manualQR.addEventListener(
      "keydown",
      async function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          manualBtn.click();
        }
      }
    );


    /* =====================================================
       HANDLE QR
    ===================================================== */

    async function handleQRCode(code) {

      code =
        String(code || "").trim();


      if (!code) {
        return;
      }


      /*
        التأكد أن Session ما زالت لحساب الاستقبال.
      */

      const {
        data: sessionData
      } =
        await supabaseClient.auth.getSession();


      if (
        !sessionData.session ||
        !isReceptionUser(
          sessionData.session.user
        )
      ) {

        await supabaseClient.auth.signOut();

        showLogin();

        showLoginMessage(
          "انتهت جلسة الدخول أو الحساب غير مصرح له."
        );

        return;
      }


      await stopScanner();


      scannerCard.classList.add(
        "hidden"
      );

      manualCard.classList.add(
        "hidden"
      );

      result.style.display =
        "block";


      guestName.textContent =
        "جاري التحقق...";

      guestSeats.textContent = "";

      resultMessage.innerHTML = "";


      const normalizedCode =
        code.toUpperCase();


      /* =================================================
         البحث عن الدعوة
      ================================================= */

      const {
        data: guestData,
        error: lookupError
      } =
        await supabaseClient.rpc(
          "get_checkin_guest",
          {
            p_qr_code:
              normalizedCode
          }
        );


      if (lookupError) {

        console.error(lookupError);

        guestName.textContent =
          "تعذر العثور على الدعوة";


        resultMessage.innerHTML = `
          <div class="danger-box">
            ${getCheckinErrorMessage(
              lookupError.message
            )}
          </div>
        `;

        return;
      }


      if (
        !guestData ||
        !guestData.length
      ) {

        guestName.textContent =
          "الدعوة غير موجودة";


        resultMessage.innerHTML = `
          <div class="danger-box">
            لم يتم العثور على هذه الدعوة.
          </div>
        `;

        return;
      }


      const guest =
        guestData[0];


      guestName.textContent =
        guest.name;


      guestSeats.textContent =
        "عدد الأشخاص: " +
        guest.seats;


      /* =================================================
         الدعوة غير مؤكدة
      ================================================= */

      if (
        guest.status !== "confirmed"
      ) {

        resultMessage.innerHTML = `
          <div class="danger-box">
            هذه الدعوة لم يتم تأكيد حضورها بعد.
          </div>
        `;

        return;
      }


      /* =================================================
         الدعوة مستخدمة مسبقًا
      ================================================= */

      if (
        guest.checked_in
      ) {

        resultMessage.innerHTML = `
          <div class="already-box">
            ⚠️ هذه الدعوة تم تسجيل دخولها مسبقًا.
          </div>
        `;

        return;
      }


      /* =================================================
         تسجيل الدخول فعليًا
      ================================================= */

      const {
        data: checkinData,
        error: checkinError
      } =
        await supabaseClient.rpc(
          "checkin_guest",
          {
            p_qr_code:
              normalizedCode
          }
        );


      if (checkinError) {

        console.error(checkinError);

        guestName.textContent =
          "تعذر تسجيل الدخول";


        resultMessage.innerHTML = `
          <div class="danger-box">
            ${getCheckinErrorMessage(
              checkinError.message
            )}
          </div>
        `;

        return;
      }


      if (
        !checkinData ||
        !checkinData.length
      ) {

        guestName.textContent =
          "تعذر تسجيل الدخول";


        resultMessage.innerHTML = `
          <div class="danger-box">
            تعذر تسجيل دخول هذه الدعوة.
          </div>
        `;

        return;
      }


      const checkedGuest =
        checkinData[0];


      guestName.textContent =
        checkedGuest.name;


      guestSeats.textContent =
        "عدد الأشخاص: " +
        checkedGuest.seats;


      resultMessage.innerHTML = `
        <div class="success-box">
          ✓ تم تسجيل دخول الضيف بنجاح
        </div>
      `;
    }


    /* =====================================================
       ERROR MESSAGES
    ===================================================== */

    function getCheckinErrorMessage(message) {

      const text =
        String(message || "");


      if (
        text.includes(
          "INVITATION_NOT_FOUND"
        )
      ) {

        return "رقم الدعوة غير موجود.";
      }


      if (
        text.includes(
          "INVITATION_NOT_CONFIRMED"
        )
      ) {

        return "هذه الدعوة لم يتم تأكيد حضورها بعد.";
      }


      if (
        text.includes(
          "ALREADY_CHECKED_IN"
        )
      ) {

        return "⚠️ هذه الدعوة تم تسجيل دخولها مسبقًا.";
      }


      if (
        text.includes(
          "RECEPTION_ONLY"
        )
      ) {

        return "هذا الحساب غير مصرح له باستخدام صفحة الاستقبال.";
      }


      if (
        text.includes(
          "UNAUTHORIZED"
        ) ||
        text.includes(
          "Unauthorized"
        )
      ) {

        return "انتهت جلسة الدخول. سجّل الدخول مرة أخرى.";
      }


      return "تعذر تسجيل الدخول لهذه الدعوة.";
    }


    /* =====================================================
       BACK
    ===================================================== */

    document
      .getElementById("backBtn")
      .addEventListener(
        "click",
        async function() {

          result.style.display =
            "none";


          scannerCard.classList.remove(
            "hidden"
          );


          manualCard.classList.remove(
            "hidden"
          );


          manualQR.value = "";


          await startScanner();
        }
      );


    /* =====================================================
       SCAN AGAIN
    ===================================================== */

    document
      .getElementById("scanAgainBtn")
      .addEventListener(
        "click",
        async function() {

          result.style.display =
            "none";


          scannerCard.classList.remove(
            "hidden"
          );


          manualCard.classList.remove(
            "hidden"
          );


          manualQR.value = "";


          await startScanner();
        }
      );


    /* =====================================================
       INITIAL SESSION CHECK
    ===================================================== */

    async function checkSession() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        console.error(error);

        showLogin();

        return;
      }


      await handleSession(
        data.session
      );
    }


    checkSession();

  </script>
